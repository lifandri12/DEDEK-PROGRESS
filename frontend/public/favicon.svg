<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0f1729" rx="40"/>
  
  <!-- Dumbbell -->
  <g transform="translate(100, 100)">
    <!-- Left weight plate -->
    <rect x="-70" y="-20" width="25" height="40" fill="#3b82f6" rx="3"/>
    
    <!-- Right weight plate -->
    <rect x="45" y="-20" width="25" height="40" fill="#3b82f6" rx="3"/>
    
    <!-- Left bar segment -->
    <rect x="-50" y="-8" width="35" height="16" fill="#60a5fa" rx="2"/>
    
    <!-- Right bar segment -->
    <rect x="15" y="-8" width="35" height="16" fill="#60a5fa" rx="2"/>
    
    <!-- Center grip -->
    <rect x="-12" y="-12" width="24" height="24" fill="#1e40af" rx="2"/>
    
    <!-- Grip pattern -->
    <line x1="-8" y1="-8" x2="-8" y2="8" stroke="#3b82f6" stroke-width="2"/>
    <line x1="-2" y1="-8" x2="-2" y2="8" stroke="#3b82f6" stroke-width="2"/>
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#3b82f6" stroke-width="2"/>
  </g>
</svg>